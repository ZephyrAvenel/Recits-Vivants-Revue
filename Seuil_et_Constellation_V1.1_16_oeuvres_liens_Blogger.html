/* V0.6 : une seule constellation, les couvertures sont les étoiles */
.living-sky{position:relative;width:100%;height:clamp(1040px,260vw,1320px);margin:20px auto 16px;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 45% 43%,#294955 0%,#172c40 44%,#101d30 80%);isolation:isolate}
.living-sky:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#e8d9b4 1px,transparent 1px);background-size:39px 49px}
.star-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.star-links path{stroke:#8caaa5;stroke-width:.24;fill:none;stroke-dasharray:.8 1.5;opacity:.35;vector-effect:non-scaling-stroke}
.star-links path.seen{stroke:#f1d7a0;stroke-width:1.7;opacity:.88;stroke-dasharray:none;filter:drop-shadow(0 0 2px #d9c98a)}
.star-work{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-10%);width:clamp(95px,23%,160px);background:transparent;color:#f4e7c9;border:0;padding:5px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.star-portrait{display:flex;position:relative;align-items:center;justify-content:center;width:100%;aspect-ratio:1.25;border:1px solid #7b9a98;border-radius:15px;background:#1b3345;box-shadow:0 0 0 5px #c3d8bd12,0 0 23px #a2c7ac22;overflow:hidden}
.star-portrait img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
.star-fallback{position:absolute;font:2rem Georgia,serif;color:#e7d2a3}
.star-work.met .star-portrait{border-color:#ead29e;box-shadow:0 0 0 5px #f3d59d1f,0 0 25px #f0d19e66}
.star-title{font:clamp(.74rem,2.6vw,.98rem)/1.23 Georgia,serif;text-align:center;text-wrap:balance;text-shadow:0 2px 6px #091525,0 0 7px #091525;max-width:100%}
.star-work:focus-visible .star-portrait,.star-work:hover .star-portrait{outline:2px solid #f1d7a0;outline-offset:3px}
@media(min-width:700px){.living-sky{height:1080px}.star-work{width:150px}.star-title{font-size:1rem}}
@media(max-width:390px){.living-sky{height:1100px}.star-work{width:24%}.star-title{font-size:.7rem}}
@media(prefers-reduced-motion:no-preference){.star-work.met .star-portrait{transition:box-shadow .5s ease}}

/* V0.6 — traces singulières, lecture et continuité */
.garden-reading{border:1px solid #597b7c;background:#132b38;border-radius:15px;padding:15px 17px;margin:15px 0}
.garden-reading h3{font-size:1.15rem;margin:0 0 8px;color:var(--gold)}
.garden-reading p{margin:6px 0;color:#dce9e5}
.garden-traces{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.garden-traces span{border:1px solid #5c807b;border-radius:18px;padding:5px 10px;color:#e8eadb;font-size:.8rem}
.garden-pause{margin:12px 0;text-align:center;color:var(--muted);font:italic 1rem/1.7 Georgia,serif}
.garden-svg .trace-mark{filter:drop-shadow(0 0 3px #edcf9a66)}
.garden-svg .trace-link{stroke:#e4c993;stroke-width:1.5;stroke-dasharray:3 5;opacity:.75;fill:none}

/* V1.0 — commandes immédiatement sous le Jardin */
.garden-controls{margin:-6px 0 14px;padding:10px 8px 12px;border:1px solid #54776f;border-radius:18px;background:#172f39}.garden-controls .gesture-row{margin:2px 0 7px;gap:8px}.garden-controls .gesture-row button{min-height:48px;padding:10px 14px;font-size:clamp(.86rem,2.9vw,1rem)}.garden-toggle{display:block;margin:4px auto 0;background:transparent;border:0;color:#b9d6ca;text-decoration:underline;text-underline-offset:4px;padding:8px 12px;font-size:.86rem}.garden-feedback{margin:12px 0}.garden-pause{margin:14px 0;text-align:center}.garden-svg{margin-bottom:12px}

/* V1.0 : présence relationnelle et dialogue sensible */
.trace-link{stroke:#e7d49e;stroke-width:1.8;stroke-dasharray:3 5;fill:none;opacity:.8;animation:link-breathe 4s ease-in-out infinite}
.relation-halo{fill:none;stroke:#e8d49b;stroke-width:1.4;opacity:.75;animation:link-breathe 4s ease-in-out infinite}
.relation-seed{fill:#f5e2af;filter:drop-shadow(0 0 4px #efd39a)}
@keyframes link-breathe{50%{opacity:.35}}
.garden-relation{border:1px solid #688d81;background:#17343d;border-radius:15px;padding:13px 16px;margin:10px 0 16px}
.garden-relation strong{color:#f1d7a0;font-family:Georgia,serif;font-weight:normal;font-size:1.12rem}
.garden-relation p{margin:7px 0 0;color:#d7e6df;font-size:.93rem}
@media(prefers-reduced-motion:reduce){.trace-link,.relation-halo{animation:none}}

/* V1.0 — médiation vivante, facultative et accessible */
.mediation{margin:18px 0;border:1px solid #64887d;border-radius:20px;background:#162e39;overflow:hidden}
.mediation>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;color:#e7cf9d;font:1.16rem Georgia,serif}
.mediation>summary::-webkit-details-marker{display:none}
.mediation>summary:after{content:'⌄';font:1.4rem system-ui;color:#a9d1c1}
.mediation[open]>summary:after{content:'⌃'}
.mediation-sub{display:block;color:#b8cfcb;font:.78rem/1.6 system-ui;margin-top:5px}
.mediation-body{padding:0 17px 18px}
.mediation-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 15px}
.mediation-tabs button{border:1px solid #557d76;background:transparent;color:#d8e8e2;border-radius:22px;padding:9px 12px;font:inherit;font-size:.86rem;cursor:pointer}
.mediation-tabs button[aria-selected="true"]{background:#315b50;border-color:#a4d0b7;color:white}
.mediation-panel{border:1px solid #496d69;border-radius:15px;padding:15px;background:#102934}
.mediation-panel h3{font:1.25rem Georgia,serif;color:#e7cf9d;margin:0 0 10px}
.mediation-panel p{margin:8px 0;line-height:1.65}
.mediation-question{font-style:italic;color:#c6d9d0}
.mediation-kicker{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:#b5d4c7}
.mediation-hint{font-size:.85rem;color:#b8cfcb;margin:13px 2px 0;line-height:1.55}

/* V1.0 — disposition mobile à deux colonnes, sans chevauchement */
.living-sky.sky-mobile{height:1580px;max-height:none}
.living-sky.sky-desktop{height:1050px;max-height:none}
.star-work{transform:translate(-50%,-50%);width:clamp(92px,21%,160px)}
.sky-mobile .star-work{width:clamp(112px,42%,165px)}
.sky-mobile .star-portrait{aspect-ratio:1.5}
.sky-mobile .star-title{font-size:clamp(.73rem,2.9vw,.91rem)}
.sky-desktop .star-work{width:clamp(115px,20%,170px)}
@media(max-width:390px){.living-sky.sky-mobile{height:1530px}.sky-mobile .star-work{width:44%}}

}

function gardenReading(){const seen=works.filter(w=>state.visits.includes(w.id));const rel=state.relations.length;const links=availableRelations();return `<section class="garden-reading" aria-label="Lire le Jardin"><h3>Ce qui habite ce Jardin</h3><p>${seen.length?`${seen.length} ${seen.length===1?'rencontre a laissé':'rencontres ont laissé'} une présence distincte.`:'Aucune rencontre n’est nécessaire pour être ici. La fleur existe déjà.'}</p>${seen.length?`<div class="garden-traces" aria-label="Œuvres rencontrées">${seen.map(w=>`<span>${esc(w.title)}</span>`).join('')}</div>`:''}<p>${rel&&links.length?`${rel} ${rel===1?'résonance prend':'résonances prennent'} forme dans le Jardin.`:'Des relations pourront apparaître entre certaines présences, si vous souhaitez les relier.'}</p></section>`}
function settings(){return `<details class="settings"><summary>Préférences et mémoire</summary><div class="settings-content"><label><input id="sound" type="checkbox" ${soundOn?'checked':''}> Activer les sons discrets</label><label><input id="remember" type="checkbox" ${state.remember?'checked':''}> Conserver mon Jardin sur cet appareil</label><p class="subtle">Sans cette option, vos rencontres restent seulement pendant cette visite. Les liens vers les œuvres ouvrent des sites externes.</p><button class="btn secondary" id="reset" type="button">Recommencer mon Jardin</button><p class="status" id="status" aria-live="polite"></p></div></details>`}
function render(){nav.classList.toggle('hidden',screen==='seuil');nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===screen?'page':'false'));let html='';if(screen==='seuil')html=`<div class="intro"><div class="eyebrow">Une expérience des Récits Vivants</div>${emblem()}<h1>Le Seuil<br>et la Constellation</h1><p>Il existe des passages que l'on découvre simplement en prenant le temps de regarder.</p><button class="btn primary" id="enter">Entrer →</button><p class="subtle">Explorez librement. Rien à réussir, aucun parcours imposé.</p></div>`;
if(screen==='constellation')html=`<div class="eyebrow">Découvrir</div><h2>La Constellation vivante</h2><p class="muted">Seize œuvres, des chemins libres. Touchez une image qui vous attire.</p>${sky()}<p class="quiet">Les fils lumineux révèlent les résonances entre les œuvres rencontrées. Aucune exploration n’est obligatoire.</p><div class="center"><button class="btn secondary" data-go="jardin">Voir le Jardin →</button></div>${settings()}`;
if(screen==='oeuvre'){let w=work(selected);const related=bridges.filter(b=>(b.a===w.id||b.b===w.id)&&state.visits.includes(b.a)&&state.visits.includes(b.b));html=`<div class="detail"><button class="btn secondary" data-go="constellation">← Les œuvres</button><div class="eyebrow" style="margin-top:22px">${esc(w.type)}</div><h2>${esc(w.title)}</h2>${w.image?`<img class="detail-image" src="${esc(w.image)}" alt="Illustration de ${esc(w.title)}">`:''}<p>${esc(w.description)}</p><div class="actions">${w.url?`<a class="btn primary" href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">Découvrir l'œuvre originale ↗</a>`:`<span class="subtle">Livre présenté ici · Pas encore d’article dédié.</span>`}<button class="btn secondary" data-go="jardin">Voir le Jardin →</button></div><div class="note">${esc(lastMessage||'Chaque rencontre peut laisser une empreinte.')}</div>${related.length?`<h3>Des échos entre les œuvres</h3>${related.map(b=>{const other=work(b.a===w.id?b.b:b.a);return `<div class="bridge"><strong>${esc(other.title)}</strong><p>${esc(b.text)}</p><button data-work="${other.id}">Découvrir cette œuvre →</button></div>`}).join('')}`:''}${settings()}</div>`}
if(screen==='jardin')html=`<div class="eyebrow">Contempler</div><h2>Le Jardin des possibles</h2><p class="muted">Chaque rencontre peut laisser une trace. Vous pouvez aussi simplement regarder.</p><div id="garden-scene">${garden()}</div><div class="garden-controls"><div class="gesture-row" aria-label="Gestes du Jardin">${showGestures?`<button data-gesture="relier">✧ Relier</button><button data-gesture="accueillir">❋ Accueillir</button><button data-gesture="difference">◇ Préserver une différence</button>`:''}</div><button class="garden-toggle" id="gesture-toggle" type="button">${showGestures?'Masquer les gestes':'Faire un geste facultatif'}</button></div>${gardenMediation()}${relationReading()}<div class="note garden-feedback" aria-live="polite">${esc(lastMessage|| (state.visits.length?`${state.visits.length} ${state.visits.length===1?'œuvre a laissé':'œuvres ont laissé'} une empreinte dans ce Jardin.`:'Une fleur vous accueille. Le reste peut venir à son rythme.'))}</div><p class="garden-pause">Vous pouvez aussi rester ici, sans rien faire.</p>${gardenReading()}<div class="actions"><button class="btn secondary" data-go="constellation">Revoir les œuvres →</button></div>${settings()}`;
app.innerHTML=html;document.querySelector('#enter')?.addEventListener('click',()=>go('constellation'));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.querySelectorAll('[data-work]').forEach(b=>b.addEventListener('click',()=>visit(b.dataset.work)));document.querySelector('#mediation')?.addEventListener('toggle',e=>{mediationOpen=e.target.open});document.querySelectorAll('[data-mediation]').forEach(b=>b.addEventListener('click',()=>{mediationTab=b.dataset.mediation;mediationOpen=true;render();document.querySelector('[data-mediation="'+mediationTab+'"]')?.focus()}));document.querySelector('#gesture-toggle')?.addEventListener('click',()=>{showGestures=!showGestures;render()});document.querySelectorAll('[data-gesture]').forEach(b=>b.addEventListener('click',()=>{const labels={relier:'Une relation devient perceptible.',accueillir:state.visits.length?'La fleur s’ouvre près des présences accueillies. Elles gardent leur place.':'La fleur s’ouvre doucement. Vous pouvez rester ici.',difference:state.visits.length>1?'Des présences demeurent distinctes, même au voisinage les unes des autres.':'Une différence trouve sa place, sans devoir être résolue.'};state.gestures.push(b.dataset.gesture);if(state.gestures.length>24)state.gestures.shift();lastMessage=labels[b.dataset.gesture];if(b.dataset.gesture==='relier')relate();else tone('gesture');persist();render();document.querySelector('[data-gesture="'+b.dataset.gesture+'"]')?.focus()}));document.querySelector('#sound')?.addEventListener('change',e=>{soundOn=e.target.checked;lastMessage=soundOn?'Les sons sont activés.':'Les sons sont désactivés.';if(soundOn)tone('visit');render()});document.querySelector('#remember')?.addEventListener('change',e=>{state.remember=e.target.checked;persist();lastMessage=state.remember?'Votre Jardin sera conservé sur cet appareil.':'La mémoire locale a été effacée.';render()});document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Recommencer le Jardin et effacer ses traces ?')){let remember=state.remember;state=fresh();state.remember=remember;lastMessage='Le Jardin recommence.';persist();render()}})}
nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));let lastMobile=window.matchMedia('(max-width:699px)').matches;window.addEventListener('resize',()=>{const now=window.matchMedia('(max-width:699px)').matches;if(now!==lastMobile){lastMobile=now;if(screen==='constellation')render()}});render();
</script></body></html>
